    ```c
    #include <dbmail.h>
    #include <glib.h>
    #include <stdio.h>
    #include <stdlib.h>
    #include <string.h>

    /* AFL++ persistent‑mode initialization */
    __AFL_FUZZ_INIT();

    /* Simple memory‑backed I/O handle used by dbmail when a FILE* is required */
    typedef struct {
        const uint8_t *data;
        size_t size;
        size_t offset;
    } mem_buf_t;

    static size_t mem_read(void *ptr, size_t size, size_t nmemb, void *userdata) {
        mem_buf_t *mb = (mem_buf_t *)userdata;
        size_t avail = mb->size - mb->offset;
        size_t to_copy = size * nmemb;
        if (to_copy > avail) to_copy = avail;
        memcpy(ptr, mb->data + mb->offset, to_copy);
        mb->offset += to_copy;
        return to_copy / size; // number of full items read
    }

    static int mem_seek(void *userdata, long offset, int whence) {
        mem_buf_t *mb = (mem_buf_t *)userdata;
        size_t newpos;
        switch (whence) {
            case SEEK_SET: newpos = offset; break;
            case SEEK_CUR: newpos = mb->offset + offset; break;
            case SEEK_END: newpos = mb->size + offset; break;
            default: return -1;
        }
        if (newpos > mb->size) return -1;
        mb->offset = newpos;
        return 0;
    }

    static int mem_close(void *userdata) {
        /* nothing to free – the buffer is owned by AFL */
        return 0;
    }

    int main(int argc, char **argv) {
        /* AFL++ entry‑point macro */
        __AFL_INIT();

        /* Global library initialization – must be called once */
        if (dbmail_init() != 0) {
            fprintf(stderr, "dbmail_init failed\n");
            return 1;
        }

        while (__AFL_LOOP(10000)) {
            const uint8_t *buf = __AFL_FUZZ_TESTCASE_BUF;
            size_t len = __AFL_FUZZ_TESTCASE_LEN;

            /* Build a memory‑backed FILE* for APIs that expect a FILE */
            mem_buf_t mb = { .data = buf, .size = len, .offset = 0 };
            FILE *f = fopencookie(&mb, "rb",
                                   (cookie_io_functions_t){ .read = mem_read,
                                                            .seek = mem_seek,
                                                            .close = mem_close,
                                                            .write = NULL });
            if (!f) continue; // skip iteration on failure

            /* Example target: parse a raw email message into a dm_message object */
            struct dm_message *msg = dm_message_new();
            if (!msg) {
                fclose(f);
                continue;
            }
            /* TODO: adapt for target function X */
            /* The public API `dm_message_parse_file` reads a MIME message from FILE* */
            dm_message_parse_file(msg, f);

            /* Clean up */
            dm_message_free(msg);
            fclose(f);
        }

        /* Global shutdown */
        dbmail_shutdown();
        return 0;
    }
